<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTF Dashboard — Ingrid Wang</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange: #FF6B35;
      --bg: #0d0d0d;
      --card: #181818;
      --card2: #1f1f1f;
      --border: #272727;
      --text: #f0f0f0;
      --muted: #888;
      --z1: #9b9b9b; --z2: #5c85d6; --z3: #4caf50; --z4: #FF8C00; --z5: #e03131;
    }

    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

    /* ── Header ── */
    header {
      background: #111; border-bottom: 2px solid var(--orange);
      padding: 16px 32px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-badge {
      background: var(--orange); color: #fff; font-weight: 900; font-size: 15px;
      width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center;
    }
    .logo h1 { font-size: 19px; font-weight: 700; }
    .logo h1 em { font-style: normal; color: var(--orange); }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .last-updated { font-size: 11px; color: var(--muted); }
    .btn {
      background: var(--orange); color: #fff; border: none; padding: 8px 16px;
      border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    .btn:hover { opacity: .85; } .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-ghost {
      background: transparent; color: var(--muted); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all .15s;
    }
    .btn-ghost:hover { border-color: var(--orange); color: var(--orange); }

    main { max-width: 1400px; margin: 0 auto; padding: 28px 32px 60px; }

    /* ── State screens ── */
    .centered {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh; gap: 18px; text-align: center;
    }
    .spinner {
      width: 42px; height: 42px; border: 3px solid var(--border);
      border-top-color: var(--orange); border-radius: 50%; animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .centered h2 { font-size: 24px; }
    .centered p { color: var(--muted); max-width: 380px; line-height: 1.6; }

    /* ── Filter bar ── */
    .filter-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 22px; }
    .filter-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-right: 4px; }
    .filter-btn {
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all .15s;
    }
    .filter-btn:hover { border-color: var(--orange); color: var(--orange); }
    .filter-btn.active { background: var(--orange); border-color: var(--orange); color: #fff; }

    /* ── Stats grid ── */
    .stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 18px; }
    .stat-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 18px; transition: border-color .2s;
    }
    .stat-card:hover { border-color: var(--orange); }
    .stat-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 800; color: var(--orange); line-height: 1; }
    .stat-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
    .stat-sub { font-size: 11px; color: #555; }
    .trend { font-size: 11px; font-weight: 700; }
    .trend.up { color: #4caf50; } .trend.down { color: #e03131; } .trend.neutral { color: #666; }

    /* ── PR panel ── */
    .section-title {
      font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;
      letter-spacing: 1.2px; margin-bottom: 12px;
    }
    .pr-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 22px; }
    .pr-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; position: relative; overflow: hidden;
    }
    .pr-card::before {
      content: "PR"; position: absolute; top: 8px; right: 10px;
      font-size: 9px; font-weight: 800; color: var(--orange); letter-spacing: 1px;
    }
    .pr-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .pr-value { font-size: 22px; font-weight: 800; color: var(--text); }
    .pr-date { font-size: 10px; color: #555; margin-top: 4px; }

    /* ── Charts ── */
    .charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 22px; }
    .chart-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px;
    }
    .chart-card.span2 { grid-column: 1 / -1; }
    .chart-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px; }
    .chart-wrap { position: relative; height: 220px; }
    .chart-wrap.tall { height: 260px; }

    /* ── Coach section ── */
    .coach-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      margin-bottom: 22px; overflow: hidden;
    }
    .coach-header {
      padding: 18px 24px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .coach-header-left { display: flex; align-items: center; gap: 12px; }
    .coach-badge {
      width: 34px; height: 34px; background: var(--orange); border-radius: 50%;
      display: grid; place-items: center; font-size: 16px;
    }
    .coach-title { font-size: 15px; font-weight: 700; }
    .coach-subtitle { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .coach-body { padding: 24px; min-height: 100px; }
    .coach-idle {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; color: var(--muted); padding: 24px 0; text-align: center;
    }
    .coach-idle p { font-size: 14px; }
    .coach-idle small { font-size: 12px; color: #555; }
    .coach-text { font-size: 14px; line-height: 1.75; color: #d0d0d0; }
    .coach-text .section-header {
      display: block; font-size: 13px; font-weight: 800; color: var(--orange);
      text-transform: uppercase; letter-spacing: 0.8px; margin: 18px 0 8px;
    }
    .coach-text .section-header:first-child { margin-top: 0; }
    .coach-text ul { list-style: none; padding: 0; }
    .coach-text ul li { padding: 3px 0 3px 18px; position: relative; }
    .coach-text ul li::before { content: "•"; position: absolute; left: 4px; color: var(--orange); }
    .coach-text ol { padding-left: 20px; }
    .coach-text ol li { padding: 3px 0; }
    .coach-cursor { display: inline-block; width: 2px; height: 14px; background: var(--orange); animation: blink .7s steps(1) infinite; vertical-align: middle; margin-left: 2px; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* ── Table ── */
    .table-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .table-header { padding: 16px 22px; border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; }
    .table-scroll { overflow-x: auto; max-height: 400px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: var(--card2); padding: 10px 14px; text-align: left;
      font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.6px;
      position: sticky; top: 0; white-space: nowrap;
    }
    tbody td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #1a1a1a; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #1a1a1a; }
    .cal { color: var(--orange); font-weight: 700; }
    .splat-hi { color: var(--orange); font-weight: 700; }
    .zone-pill { display: flex; height: 6px; border-radius: 3px; overflow: hidden; width: 80px; }
    .zp1 { background: var(--z1); } .zp2 { background: var(--z2); }
    .zp3 { background: var(--z3); } .zp4 { background: var(--z4); } .zp5 { background: var(--z5); }

    /* ── Responsive ── */
    @media (max-width: 1100px) {
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
      .pr-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 700px) {
      main { padding: 16px; } header { padding: 12px 16px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .pr-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-grid { grid-template-columns: 1fr; }
      .chart-card.span2 { grid-column: 1; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-badge">OT</div>
    <h1>Ingrid's <em>OTF</em> Dashboard</h1>
  </div>
  <div class="header-right">
    <span class="last-updated" id="lastUpdated"></span>
    <button class="btn" id="refreshBtn" onclick="loadData()">↻ Refresh</button>
  </div>
</header>

<main id="app">
  <div class="centered">
    <div class="spinner"></div>
    <p>Fetching your workouts from Gmail…</p>
  </div>
</main>

<script>
Chart.defaults.color = "#888";
Chart.defaults.borderColor = "#272727";

let allWorkouts = [];   // always full unfiltered set
let charts = {};
let currentFilter = localStorage.getItem("otfFilter") || "all";
let coachInsightsCache = null; // cached until user clicks Regenerate

function destroyAll() { Object.values(charts).forEach(c => c.destroy()); charts = {}; }

// ── Utilities ──────────────────────────────────────────────────
function avg(arr, fn) { return arr.length ? arr.reduce((s, x) => s + fn(x), 0) / arr.length : 0; }
function sum(arr, fn) { return arr.reduce((s, x) => s + fn(x), 0); }
function max(arr, fn) { return arr.reduce((best, x) => fn(x) > fn(best) ? x : best, arr[0]); }

function parseDate(d) { const [m, dd, y] = d.split("/"); return new Date(+y, +m - 1, +dd); }

function filterByDays(ws, days) {
  if (!days) return ws;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  cutoff.setHours(0, 0, 0, 0);
  return ws.filter(w => parseDate(w.date) >= cutoff);
}

function getFilterDays() {
  return { "30d": 30, "60d": 60, "90d": 90, "all": null }[currentFilter] ?? null;
}

function trendPct(curr, prev) {
  if (!prev) return null;
  return Math.round(((curr - prev) / prev) * 100);
}

function trendHtml(pct, higherIsBetter = true) {
  if (pct === null || isNaN(pct)) return "";
  const good = higherIsBetter ? pct >= 0 : pct <= 0;
  const cls = pct === 0 ? "neutral" : good ? "up" : "down";
  const sign = pct > 0 ? "+" : "";
  return `<span class="trend ${cls}">${sign}${pct}%</span>`;
}

// ── Load data ──────────────────────────────────────────────────
async function loadData() {
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true; btn.textContent = "Loading…";
  try {
    const res = await fetch("/api/workouts");
    if (res.status === 401) {
      const body = await res.json();
      body.error === "no_credentials" ? showSetup() : showAuth(body.login_url);
      return;
    }
    if (!res.ok) throw new Error();
    const EXCLUDED_DATES = ["04/30/2026"]; // watch had no battery — outlier
    allWorkouts = (await res.json()).filter(w => !EXCLUDED_DATES.includes(w.date));
    coachInsightsCache = null;
    renderDashboard();
    document.getElementById("lastUpdated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch {
    document.getElementById("app").innerHTML = `<div class="centered"><p style="color:#e03131">⚠ Could not load data — is the server running?</p></div>`;
  } finally {
    btn.disabled = false; btn.textContent = "↻ Refresh";
  }
}

function showSetup() {
  document.getElementById("app").innerHTML = `
    <div class="centered">
      <h2>One-time Setup Required</h2>
      <p>Place your <code style="background:#1f1f1f;padding:2px 6px;border-radius:4px">credentials.json</code> from Google Cloud Console in the <code style="background:#1f1f1f;padding:2px 6px;border-radius:4px">otf-dashboard/</code> folder, then refresh.</p>
      <button class="btn" onclick="loadData()">↻ Try Again</button>
    </div>`;
}

function showAuth(loginUrl) {
  document.getElementById("app").innerHTML = `
    <div class="centered">
      <h2>Connect Gmail</h2>
      <p>Sign in with the Google account that receives your OrangeTheory beat reports.</p>
      <a href="${loginUrl}" class="btn" style="text-decoration:none;padding:10px 24px">Connect Gmail →</a>
    </div>`;
}

// ── Render dashboard ───────────────────────────────────────────
function renderDashboard() {
  destroyAll();
  const days = getFilterDays();
  const ws = filterByDays(allWorkouts, days);

  // Trend comparison: current window vs equal prior window
  const priorEnd = days ? (() => { const d = new Date(); d.setDate(d.getDate() - days); return d; })() : null;
  const priorWs = priorEnd ? filterByDays(allWorkouts, days * 2).filter(w => parseDate(w.date) < priorEnd) : [];

  const n = ws.length;
  if (!n) {
    document.getElementById("app").innerHTML = `<div class="centered"><p style="color:var(--muted)">No workouts in this date range.</p></div>`;
    return;
  }

  // ── Stats ──
  const totalCal   = sum(ws, w => w.calories);
  const totalSplat = sum(ws, w => w.splat_points);
  const avgCal     = Math.round(totalCal / n);
  const avgSplat   = (totalSplat / n).toFixed(1);
  const avgHR      = Math.round(avg(ws, w => w.avg_hr));
  const perWeek    = (n / Math.max((days || 77) / 7, 1)).toFixed(1);

  // Trends
  const pn = priorWs.length;
  const tCal   = pn ? trendPct(avgCal,   Math.round(avg(priorWs, w => w.calories))) : null;
  const tSplat = pn ? trendPct(+avgSplat, +avg(priorWs, w => w.splat_points).toFixed(1)) : null;
  const tHR    = pn ? trendPct(avgHR,    Math.round(avg(priorWs, w => w.avg_hr))) : null;

  // ── PRs (always from allWorkouts) ──
  const bestCal   = max(allWorkouts, w => w.calories);
  const bestSplat = max(allWorkouts, w => w.splat_points);
  const bestPkHR  = max(allWorkouts, w => w.peak_hr);
  const mostSteps = max(allWorkouts, w => w.steps);
  const bestAvgHR = max(allWorkouts, w => w.avg_hr);

  // Treadmill/rower totals — from filtered ws so date range applies
  const tmFiltered  = ws.filter(w => w.treadmill_miles != null);
  const rowFiltered = ws.filter(w => w.rower_meters   != null);
  const totalTMMiles  = tmFiltered.length  ? sum(tmFiltered,  w => w.treadmill_miles).toFixed(2) : null;
  const totalRowMeters= rowFiltered.length ? sum(rowFiltered, w => w.rower_meters)               : null;
  // PRs — always all-time
  const tmAll  = allWorkouts.filter(w => w.treadmill_miles != null);
  const rowAll = allWorkouts.filter(w => w.rower_meters   != null);
  const bestTMMiles   = tmAll.length  ? max(tmAll,  w => w.treadmill_miles)            : null;
  const bestTMSpeed   = tmAll.length  ? max(tmAll,  w => w.treadmill_max_speed ?? 0)   : null;
  const bestRowMeters = rowAll.length ? max(rowAll, w => w.rower_meters)               : null;
  const bestRowWatt   = rowAll.length ? max(rowAll, w => w.rower_max_wattage ?? 0)     : null;
  // Best split = lowest seconds (fastest) — filter out nulls
  const splitToSec = s => { if (!s) return Infinity; const [m,sec]=s.split(":").map(Number); return m*60+sec; };
  const bestSplitW = rowAll.length ? rowAll.reduce((b,w) => splitToSec(w.rower_500m_split) < splitToSec(b.rower_500m_split) ? w : b, rowAll[0]) : null;

  // ── Weekly frequency ──
  const streak = calcStreak(allWorkouts);

  document.getElementById("app").innerHTML = `
    <!-- Filter bar -->
    <div class="filter-bar">
      <span class="filter-label">Show</span>
      ${["30d","60d","90d","all"].map(f => `
        <button class="filter-btn ${currentFilter===f?"active":""}" onclick="setFilter('${f}')">
          ${f === "all" ? "All Time" : "Last " + f}
        </button>`).join("")}
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      ${statCard("Sessions", n, perWeek + "/wk avg", "")}
      ${statCard("Avg Calories", avgCal, "", trendHtml(tCal))}
      ${statCard("Avg Splat Pts", avgSplat, "goal: 12+", trendHtml(tSplat))}
      ${totalTMMiles  ? statCard("Total TM Miles",  totalTMMiles + " mi",   tmAll.length  + " sessions", "") : ""}
      ${totalRowMeters? statCard("Total Rower",     (totalRowMeters/1000).toFixed(2) + " km", rowAll.length + " sessions", "") : ""}
      ${statCard("Avg Heart Rate", avgHR + " bpm", "", trendHtml(tHR, false))}
    </div>

    <!-- PRs -->
    <div class="section-title">Personal Records — All Time</div>
    <div class="pr-grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">
      ${prCard("Best Calories", bestCal.calories, bestCal.date)}
      ${prCard("Best Splat Pts", bestSplat.splat_points, bestSplat.date)}
      ${prCard("Peak Heart Rate", bestPkHR.peak_hr + " bpm", bestPkHR.date)}
      ${prCard("Most Steps", mostSteps.steps.toLocaleString(), mostSteps.date)}
      ${bestTMMiles  ? prCard("Best TM Distance", bestTMMiles.treadmill_miles + " mi", bestTMMiles.date) : ""}
      ${bestTMSpeed  ? prCard("Best TM Top Speed", bestTMSpeed.treadmill_max_speed + " mph", bestTMSpeed.date) : ""}
      ${bestRowMeters? prCard("Best Row Distance", bestRowMeters.rower_meters + " m", bestRowMeters.date) : ""}
    </div>

    <!-- Charts -->
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">Calories Burned</div>
        <div class="chart-wrap"><canvas id="cCal"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Splat Points <span style="font-weight:400;color:#555">(goal 12+)</span></div>
        <div class="chart-wrap"><canvas id="cSplat"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Heart Rate — Avg &amp; Peak</div>
        <div class="chart-wrap"><canvas id="cHR"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Steps per Session</div>
        <div class="chart-wrap"><canvas id="cSteps"></canvas></div>
      </div>
      <div class="chart-card span2">
        <div class="chart-title">Heart Rate Zone Distribution <span style="font-weight:400;color:#555">(minutes per session)</span></div>
        <div class="chart-wrap tall"><canvas id="cZones"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Avg Splat Points by Coach</div>
        <div class="chart-wrap"><canvas id="cCoachSplat"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Workouts per Week <span style="font-weight:400;color:#555">(${streak} week streak)</span></div>
        <div class="chart-wrap"><canvas id="cFreq"></canvas></div>
      </div>
    </div>

    <!-- Treadmill section -->
    <div class="section-title" id="tmSection" style="display:none">🏃 Treadmill Performance</div>
    <div class="charts-grid" id="tmGrid" style="display:none">
      <div class="chart-card">
        <div class="chart-title">Distance <span style="font-weight:400;color:#555">(miles)</span></div>
        <div class="chart-wrap"><canvas id="cTMDist"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Speed — Avg &amp; Max <span style="font-weight:400;color:#555">(mph)</span></div>
        <div class="chart-wrap"><canvas id="cTMSpeed"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Incline — Avg &amp; Max <span style="font-weight:400;color:#555">(%)</span></div>
        <div class="chart-wrap"><canvas id="cTMIncline"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Elevation Climbed <span style="font-weight:400;color:#555">(feet)</span></div>
        <div class="chart-wrap"><canvas id="cTMElev"></canvas></div>
      </div>
      <div class="chart-card span2" id="tmStatsCard">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
          <div class="chart-title" style="margin-bottom:0">Treadmill Session Stats</div>
          <button class="btn-ghost" style="font-size:11px" onclick="toggleTable('tmRawWrap','tmToggle')">
            <span id="tmToggle">▶ Show raw data</span>
          </button>
        </div>
        <div id="tmSummaryStats" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:4px"></div>
        <div id="tmRawWrap" style="display:none;overflow-x:auto;margin-top:14px">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr>
              <th style="text-align:left;padding:8px 12px;color:#666;font-size:11px;border-bottom:1px solid #272727">Date</th>
              <th style="text-align:left;padding:8px 12px;color:#666;font-size:11px;border-bottom:1px solid #272727">Miles</th>
              <th style="text-align:left;padding:8px 12px;color:#666;font-size:11px;border-bottom:1px solid #272727">Time</th>
              <th style="text-align:left;padding:8px 12px;color:#666;font-size:11px;border-bottom:1px solid #272727">Avg mph</th>
              <th style="text-align:left;padding:8px 12px;color:#666;font-size:11px;border-bottom:1px solid #272727">Max mph</th>
              <th style="text-align:left;padding:8px 12px;color:#666;font-size:11px;border-bottom:1px solid #272727">Avg Incline</th>

function tableRow(w) {
  const tot = w.zone_gray + w.zone_blue + w.zone_green + w.zone_orange + w.zone_red || 1;
  const pct = z => ((z / tot) * 100).toFixed(1) + "%";
  const d = (v, suffix="") => v != null ? v + suffix : `<span style="color:#444">—</span>`;
  return `<tr>
    <td>${w.date}</td><td>${w.time}</td><td>${w.coach}</td>
    <td class="cal">${w.calories}</td>
    <td class="${w.splat_points >= 12 ? "splat-hi" : ""}">${w.splat_points}</td>
    <td>${w.avg_hr}</td><td>${w.peak_hr}</td>
    <td>${w.steps.toLocaleString()}</td>
    <td>${d(w.treadmill_miles)}</td>
    <td>${d(w.treadmill_avg_speed)}</td>
    <td>${d(w.treadmill_max_speed)}</td>
    <td>${d(w.treadmill_elevation, " ft")}</td>
    <td>${d(w.rower_meters, " m")}</td>
    <td>${d(w.rower_avg_wattage, " W")}</td>

function miniStat(label, value) {
  return `<div style="background:#111;border:1px solid #272727;border-radius:10px;padding:12px 14px">
    <div style="font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">${label}</div>

  </div>`;
}

function calcStreak(ws) {
  if (!ws.length) return 0;
  const weeks = new Set(ws.map(w => {
    const d = parseDate(w.date);
    const jan1 = new Date(d.getFullYear(), 0, 1);
    return d.getFullYear() + "-" + Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  }));
  const sorted = [...weeks].sort();
  let streak = 1, max = 1;
  for (let i = 1; i < sorted.length; i++) {
    const [y1, w1] = sorted[i-1].split("-").map(Number);
    const [y2, w2] = sorted[i].split("-").map(Number);
    const diff = (y2 - y1) * 52 + (w2 - w1);
    streak = diff === 1 ? streak + 1 : 1;
    max = Math.max(max, streak);
  }
  return max;
}

    const splitsOnly  = rowWs.filter(w => w.rower_500m_split);
    const avgSplitSec = splitsOnly.length ? sum(splitsOnly, w => splitToSec(w.rower_500m_split)) / splitsOnly.length : null;
    const avgSplitFmt = avgSplitSec ? `${Math.floor(avgSplitSec/60)}:${String(Math.round(avgSplitSec%60)).padStart(2,"0")}` : "—";
    document.getElementById("rowSummaryStats").innerHTML = [
      miniStat("Total Distance", (+rowTotalM).toLocaleString() + " m"),
      miniStat("Avg Distance", rowAvgM + " m"),
      miniStat("Avg Wattage", rowAvgWatt + " W"),
      miniStat("Avg 500m Split", avgSplitFmt),
      miniStat("Avg Stroke Rate", rowAvgStroke + " spm"),
      miniStat("Sessions w/ Rower", rowWs.length),
    ].join("");

    // Rower detail table
    const d2 = (v, s="") => v != null ? v+s : "—";
    document.getElementById("rowTableBody").innerHTML = [...rowWs].reverse().map(w => `
      <tr style="border-bottom:1px solid #1a1a1a">
        <td style="padding:8px 12px">${w.date}</td>
        <td style="padding:8px 12px;color:#5c85d6;font-weight:700">${d2(w.rower_meters, " m")}</td>
        <td style="padding:8px 12px">${d2(w.rower_time)}</td>
        <td style="padding:8px 12px">${d2(w.rower_avg_wattage, " W")}</td>
        <td style="padding:8px 12px">${d2(w.rower_max_wattage, " W")}</td>
        <td style="padding:8px 12px">${d2(w.rower_avg_speed, " km/h")}</td>
        <td style="padding:8px 12px">${d2(w.rower_max_speed, " km/h")}</td>
        <td style="padding:8px 12px">${d2(w.rower_500m_split)}</td>
        <td style="padding:8px 12px">${d2(w.rower_avg_stroke_rate)}</td>
      </tr>`).join("");
  }

  // Weekly frequency (from allWorkouts)
  const weekMap = {};
  allWorkouts.forEach(w => {
    const d = parseDate(w.date);
    const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const key = mon.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    weekMap[key] = (weekMap[key] || 0) + 1;
  });
  const weekLabels = Object.keys(weekMap);
  const weekCounts = weekLabels.map(k => weekMap[k]);

  charts.freq = new Chart(document.getElementById("cFreq"), {
    type: "bar",
    data: { labels: weekLabels, datasets: [{ data: weekCounts, backgroundColor: weekCounts.map(c => c >= 3 ? "#FF6B35" : "rgba(255,107,53,0.35)"), borderRadius: 4 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { afterLabel: ctx => ctx.raw >= 3 ? "💪 Strong week" : "" } } },
      scales: { x: axis, y: { ...axis, beginAtZero: true, ticks: { stepSize: 1 }, title: { display: true, text: "Workouts", color: "#666" } } },
    },
  });
}

// ── AI Coach ──────────────────────────────────────────────────
async function getInsights(regenerate) {
  if (coachInsightsCache && !regenerate) return;

  const insightBtn = document.getElementById("insightBtn");
  const regenBtn = document.getElementById("regenBtn");
  const body = document.getElementById("coachBody");

  insightBtn.style.display = "none";
  regenBtn.style.display = "none";
  body.innerHTML = `<div class="coach-idle"><div class="spinner" style="width:28px;height:28px;border-width:2px"></div><p>Your coach is reviewing your data…</p></div>`;

  let fullText = "";
  try {
    const res = await fetch("/api/coach-insights", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ workouts: allWorkouts }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "Server error");
    }

    body.innerHTML = `<div class="coach-text" id="coachText"></div>`;
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const payload = line.slice(6);
        if (payload === "[DONE]") { removeCoachCursor(); break; }
        try { fullText += JSON.parse(payload); } catch {}
        renderCoachMarkdown(fullText, true);
      }
    }
    removeCoachCursor();
    coachInsightsCache = fullText;
  } catch (e) {
    body.innerHTML = `<div class="coach-idle"><p style="color:#e03131">⚠ ${e.message}</p><small>Make sure ANTHROPIC_API_KEY is set when starting the server.</small></div>`;
  } finally {
    insightBtn.style.display = "none";
    regenBtn.style.display = "";
  }
}

function renderCoachMarkdown(text, streaming = false) {
  const el = document.getElementById("coachText");
  if (!el) return;

  // Parse sections delimited by **Header**
  let html = text
    .replace(/\*\*(.+?)\*\*/g, (_, h) => `<span class="section-header">${h}</span>`)
    .replace(/^• (.+)$/gm, "<li>$1</li>")
    .replace(/(<li>[\s\S]*?<\/li>)/g, (block) => `<ul>${block}</ul>`)
    .replace(/^\d+\.\s+(.+)$/gm, "<li>$1</li>")
    .replace(/\n{2,}/g, "<br><br>")
    .replace(/\n/g, "<br>");

  el.innerHTML = html + (streaming ? '<span class="coach-cursor"></span>' : "");
}

function removeCoachCursor() {
  const cursor = document.querySelector(".coach-cursor");
  if (cursor) cursor.remove();
}

loadData();
